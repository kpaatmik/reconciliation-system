spring.application.name=reconciliation
spring.datasource.url=jdbc:postgresql://localhost:5432/reconciliation
spring.datasource.username=postgres
spring.datasource.password=7008

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Run a single discovered job automatically when the app starts
spring.batch.job.enabled=false

# Initialize Spring Batch metadata tables when needed
spring.batch.jdbc.initialize-schema=always

# Input CSV files
reconciliation.input.directory=D:/reconciliation/input
reconciliation.input.baseline-file=baseline.csv
reconciliation.input.source-file=source.csv

# Output directory
reconciliation.output.directory=D:/reconciliation/output

# Batch processing
reconciliation.chunk-size=500

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true